<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momo · S0 环境验收</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../sketch.css"><style>main{max-width:850px}label{display:flex;align-items:center;gap:16px;min-height:64px;margin:12px 0;line-height:1.7}input{width:26px;height:26px;flex-shrink:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fffaf0;border:1px dashed #b9ab91;padding:20px;border-radius:var(--sketch-radius)}button{margin:12px 12px 12px 0}h1{font-size:36px}</style></head><body><header><a href="/">✦ MOMO PLANET</a><span>S0 · 本机环境验收</span></header><main><h1>记录这台设备的运行环境</h1><p>请用目标 Chrome 稳定版打开本页，将缩放设为 100%，扩大窗口。此页只读取环境和服务状态，不播放声音、不产生体验记录。</p><label><input type="checkbox" id="zoom">我已在浏览器菜单确认缩放为 100%</label><label><input type="checkbox" id="stable">我使用的是 Chrome 稳定版（非 Beta / Dev / Canary）</label><label><input type="checkbox" id="mouse">这次使用鼠标操作</label><button id="inspect">重新检查环境</button><button id="copy">复制验收结果</button><button id="download">下载验收记录</button><p id="status" role="status"></p><pre id="report">正在读取……</pre></main><script src="browser-target.js?v=chrome"></script><script src="baseline.js?v=chrome"></script></body></html>
