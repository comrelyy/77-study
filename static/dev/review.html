<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momo · S1 审阅记录</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../sketch.css"><link rel="stylesheet" href="review.css?v=s1"></head><body><header><a href="index.html">✦ MOMO · 返回双情景原型</a></header><main><h1>S1 规格与样音审阅</h1><p>开发审阅页，仅保存可下载的记录，不写家庭数据。先核对项目中的交互契约与流程规格，再实际操作双情景原型。样音必须是本地文件，不能以回退语音代替。</p><p id="load-status" role="status">正在检查样音……</p><button id="reload">重新加载本地样音</button><section id="samples" aria-label="十项样音"></section><form id="review-form"><label>审阅者<input id="reviewer" type="text" autocomplete="off"></label><fieldset><legend>请仅勾选实际完成的项目</legend><label><input type="checkbox" name="flowsReviewed">已核对首次启动、模块进出、暂停、失败、额度到点及家长流程规格</label><label><input type="checkbox" name="contractsReviewed">已核对稳定ID、内容约束、记录、恢复、幂等与版本兼容契约</label><label><input type="checkbox" name="prototypeVisualReviewed">已在目标Chrome视口操作双情景原型，检查手绘一致性、主操作与退出</label><label><input type="checkbox" name="sampleListeningReviewed" disabled>已完整试听十项本地样音，并核对文本、含义、角色、语速、音量和暂停重听</label><label><input type="checkbox" name="sourceRightsReviewed">项目内容负责人已核查声音来源与本次使用范围的权限依据</label></fieldset><label>来源与使用依据<textarea id="rights" rows="3" placeholder="填写可核查的来源、使用范围和依据；未核查则留空"></textarea></label><label>发现的问题及处理结论<textarea id="notes" rows="4"></textarea></label><button type="submit">导出当前审阅记录</button></form><pre id="result" aria-live="polite"></pre></main><script src="review-core.js?v=s1"></script><script src="review-page.js?v=s1"></script></body></html>
