<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S5 · 发布与试用核验</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../sketch.css"><style>main{max-width:900px}h1{font-size:36px}label{display:block;margin:18px 0}select,textarea{display:block;width:100%;box-sizing:border-box;margin-top:10px;padding:12px;font:inherit;background:var(--paper);color:var(--ink);border:2px solid var(--pencil);border-radius:14px}select,button{min-height:64px}textarea{min-height:90px}input{width:24px;height:24px;vertical-align:middle}section{margin:24px 0;padding:20px;border:1px dashed var(--pencil)}button{margin:10px}li{margin:10px 0}</style></head><body><header><a href="/">✦ MOMO PLANET</a><span>S5 · 发布与家庭试用</span></header><main><h1>发布前，一项一项核验</h1><p>此页只在浏览器保存核验草稿，可下载报告。故障、跨日与清除测试请使用隔离服务和临时库，不操作家庭记录。未测试的项目保留“未测试”。</p><p id="status" role="status">正在读取版本清单……</p><section><h2>当前发布阻断</h2><ul id="blockers"></ul></section><form id="review" hidden><section id="environment"><h2>实机环境</h2><label><input type="checkbox" id="chromeStable"> 已确认使用 Chrome 稳定版</label><label><input type="checkbox" id="zoom100"> 已确认缩放 100%</label><label><input type="checkbox" id="mouse"> 使用鼠标操作</label></section><section id="matrix"><h2>实机检查矩阵</h2></section><section><h2>自愿家庭试用观察</h2><p>工程核验通过后再开展自愿试用。不要记录姓名、联系方式、录音或儿童身份；只写实际观察，不推断掌握程度。</p><label>观察状态<select id="trialState"><option value="pending">尚未开展</option><option value="observed">已自愿参与并完成观察</option></select></label><label>孩子是否能独立开始与结束<textarea id="independence"></textarea></label><label>困惑、卡住或需要帮助的地方<textarea id="friction"></textarea></label><label>是否愿意再次体验，以及实际反馈<textarea id="feedback"></textarea></label></section><button type="submit">下载核验与观察记录</button></form></main><script type="module" src="s5-review.mjs"></script></body></html>
